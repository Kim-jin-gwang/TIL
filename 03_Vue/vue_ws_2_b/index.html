<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .is-completed {
      text-decoration: line-through;
    }
  </style>
</head>

<body>
  <div id="app">
    <h1>Todo Application</h1>
    <form @submit.prevent="addTodo">
      <input type="text" v-model="nextTodo">
      <input type="submit" value="Add">
    </form>

    <ul>
      <li v-for="todo in todos" :key="todo.id">
        <input type="checkbox" v-model="todo.isCompleted">
        <span :class="{ 'is-completed': todo.isCompleted }">{{ todo.text }}</span>
        <button @click="deleteTodo(todo.id)">Delete</button>
      </li>
    </ul>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script>
    const { createApp, ref } = Vue

    const app = createApp({
      setup() {
        const todos = ref([])

        const nextTodo = ref('')
        const addTodo = () => {

          const text = nextTodo.value.trim()
          if (!text) return

          const tmpTodo = {
            id: Date.now(),
            text: text,
            isCompleted: false
          }

          todos.value.push(tmpTodo)
          nextTodo.value = ''

        }

        const deleteTodo = (id) => {
          const idx = todos.value.findIndex(todo=>todo.id ===id)
          if (idx===-1) return

          todos.value.splice(idx,1)
          

        }


        return { todos,nextTodo, addTodo,deleteTodo }
      }
    })

    app.mount('#app')
  </script>
</body>

</html>
