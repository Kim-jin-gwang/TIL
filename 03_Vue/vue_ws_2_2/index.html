<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <div id="app">
    <h1>다양한 전시 정보</h1>

    <label for="isActive">전시 중인 정보만 보기</label>
    <input type="checkbox" id="isActive" v-model="isActive">
    <ul>
      <li v-for="(item,idx) in isActiveExhibition">
        <h3>{{item.title}} </h3>
        <hr>
        <p>{{item.place}}</p>
        <p>가격 : {{item.price}}</p>
        <hr>
      </li>
    </ul>
  </div>

  <script>
    /*
      3. 전시 중인 정보만 볼 것인지 체크하는 변수 isActive를 작성한다.
				- checkBox의 값과 양방향 바인딩 되어야 한다.
        - isActive가 True인 경우, isActiveExhibition 배열을 화면에 렌더링한다.
        - 아닌경우, 모든 객체 정보를 담고 있는 배열을 화면에 렌더링한다.

    */

    const {createApp,ref,computed} = Vue

    const app = createApp({
      setup(){
        const isActive = ref(false)

        const infoArr = ref([
          {title: '무라카미 다카시: 무라카시좀비',place: '부산 시립 미술관', price: 1000, progress:true},
          {title: '마우라치오 카텔란 개인전',place: '리움 미술관', price: 30000, progress:true},
          {title: '조선백자전',place: '리움 미술관', price: 30000, progress:true},
          {title: '한국 실험미술 1960 - 1970',place: '국립현대미술관', price: 0, progress:true},
          {title: '에드워드 호퍼 : 길 위에서',place: '서울 시립 미술관', price: 1000, progress:false},
          {title: '알렉산더 칼더 x 이우환',place: '국제갤러리 서울점', price: 15000, progress:false},
        ])

        const isActiveExhibition = computed(() =>{
          if (isActive.value){
            return infoArr.value.filter(item => item.progress === true)
          } else {
            return infoArr.value
          }
        })

        return {
          isActive,
          infoArr,
          isActiveExhibition
        }
      }
    })
    app.mount('#app')
  </script>
</body>
</html>
