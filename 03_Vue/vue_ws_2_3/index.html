<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
	<style>
    li {
      padding: 10px;
      border: 1px solid #ccc;
      margin: 10px 0;
      background-color: #f5f5f5;
    }
    .cheap {
      background-color: #e1f7e1;
    }
    .expensive {
      background-color: #f7e1e1;
    }
  </style>
</head>
<body>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <div id="app">
    <h1>다양한 전시 정보</h1>

    <label for="isActive">전시 중인 정보만 보기</label>
    <input type="checkbox" id="isActive"v-model="isActive">
      <ul>
        <li v-for="item in isActiveExhibition" :class="{
          cheap: item.price <= 5000,
          expensive: item.price >= 20000
        }">
          <h3>{{item.title}} </h3>
          <hr>
          <p>전시 장소 : {{item.place}}</p>
          <p>가격 : {{item.price}}</p>
          <p v-if="item.price === 0">무료 전시입니다.</p>
          <hr>
        </li>
      </ul>
  </div>

  <script>
    /*
			2. li태그에 조건부 클래스 바인딩을 활용하여 적절한 클래스를 부여하시오.
				- 전시 가격이 5000 이하이면 cheap 클래스를 부여한다.
				- 전시 가격이 20000 이상이면 expensive 클래스를 부여한다.
			3. 전시 가격이 0원인 경우, 가격 표시 아래에 "무료 전시입니다." 문구를 보여준다.
	
    */
    const {createApp,ref,computed} = Vue

    const app = createApp({
      setup(){
        const isActive = ref(false)

        const infoArr = ref([
          {title: '무라카미 다카시: 무라카시좀비',place: '부산 시립 미술관', price: 1000, progress:true},
          {title: '마우라치오 카텔란 개인전',place: '리움 미술관', price: 30000, progress:true},
          {title: '조선백자전',place: '리움 미술관', price: 30000, progress:true},
          {title: '한국 실험미술 1960 - 1970',place: '국립현대미술관', price: 0, progress:true},
          {title: '에드워드 호퍼 : 길 위에서',place: '서울 시립 미술관', price: 1000, progress:false},
          {title: '알렉산더 칼더 x 이우환',place: '국제갤러리 서울점', price: 15000, progress:false},
        ])

        const isActiveExhibition = computed(() =>{
          if (isActive.value){
            return infoArr.value.filter(item => item.progress === true)
          } else {
            return infoArr.value
          }
        })

        return {
          isActive,
          infoArr,
          isActiveExhibition
        }
      }
    })
    app.mount('#app')
  </script>
</body>
</html>
