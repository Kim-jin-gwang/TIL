<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>글꼴 테스트기</title>
  <style>
    ul {
      list-style: none;
      padding: 0;
    }

    li {
      margin-bottom: 10px;
      padding: 10px;
      border: 1px solid #ccc;
      background-color: #f5f5f5;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }

    input {
      width: calc(100% - 12px);
      margin-bottom: 5px;
      padding: 5px;
    }
  </style>
</head>
<body>
  <div id="app">
    <h1>글꼴 테스트기</h1>
    <ul>
      <!-- 
        for문에서 template 태그를 사용하는 이유는? 
        그, for문으로 반복하는 구간 내부에 반복되어야 할 요소들이 여러개여서
        하나의 element(태그, 요소)만으로는 관리하기 힘들다면?

        예를들어, li태그 여러개가 필요한대. 
        그 여러개의 li태그의 계층이 동일하다면 
        그때 template으로 감싸서 동일한 수준의 li태그 여러개를 반복한다.
        <template v-for="item in array">
          <li>{{ item.pk }}</li>
          <li>{{ item.title }}</li>
          <li>{{ item.content }}</li>
        </template>
      -->
      <!-- 우리가 직접 쓸건 아니지만, 
        Vue가 내부적으로 객체들을 정상적으로 렌더링 할 수 있도록 
        (그리고 효율적으로)
        key값을 고유한 값으로 반드시 설정해 주자.
       -->
      <li v-for="font in fonts" v-bind:key="font.style">
        <label v-bind:for="font.style">{{ font.style }}</label>
        <input type="text" :id="font.style" v-model="font.text">
        <div>{{ font.text }}</div>
      </li>
    </ul>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script>
    const { createApp, ref } = Vue
    const app = createApp({
      setup() {
        const fonts = ref([
          {style: '바탕', text: null},
          {style: '휴먼엽서체', text: null},
          {style: '궁서체', text: null},
        ])
        return {
          fonts
        }
      }
    })
    app.mount('#app')
    /*
      - Vue3 CDN을 사용한다.
      1. 새로운 app instance를 생성하여 아이디가 app인 container에 mount 하시오.
      2. 객체 3개를 요소로 가지고 있는 배열 fonts를 정의한다.
        - 각 객체가 가진 값은 다음과 같다.
          1. style: 바탕, text: null
          2. style: 휴먼엽서체, text: null
          3. style: 궁서체, text: null
      3. fonts 배열이 가지고 있는 요소의 수 만큼 li태그가 생성될 수 있도록 반복문을 사용한다.
        - 이때, 키 값은 폰트 스타일이 되도록 설정한다.
      4. label은 객체가 가진 글꼴 이름을 text Content가 되도록 설정한다.
      5. input 태그에 값을 입력하면 각 객체의 text 값이 되도록 양방향 바인딩을 설정한다.
      6. 입력된 값은 li 태그 속 div태그에 렌더링 되도록 한다.
        - font-family 값이 객체가 가진 style의 값이 되도록 inline style에 속성을 바인딩 한다.
        - 입력값이 없을때는 화면에 div 태그가 그려지지 않아야 한다. (초기 렌더링은 되어 있어야 함)
    */
  </script>
</body>
</html>
