<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <style>
    .mother{
      margin: 100px;
      width:370px;
      border: 1px solid black;
    }

    .mother img{
      width: 100%;
      display: block;
    }

    .mother > div{
      position:relative;
    }

    .mother >p{
      margin:12px;
    }
    
    .name{
      background-color: rgba(253, 190, 190, 0.6);
      font-size: 30px;
      font-weight: 700;
      
      margin:0;
      padding: 12px 0;
      
      position: absolute;
      bottom:0;
      left:0;
      width:100%;

      text-align: center;
    }



  </style>
</head>
<body>
  <div class="mother">
    <div>
      <img src="image.png" alt="Profile Image">
      <p class="name">Name</p>
    </div>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Adipisci unde officiis ad nostrum. Laboriosam mollitia similique provident fuga tenetur saepe sit, amet eaque neque eius quaerat expedita ea illum veniam.</p>
  </div>
</body>
</html>
