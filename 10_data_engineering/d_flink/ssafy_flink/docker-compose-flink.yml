# docker network create de_net
services:
  jobmanager:
    build: .
    image: pyflink
    container_name: flink_jobmanager
    hostname: jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: jobmanager
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
    volumes:
      - ./workspace:/opt/flink/workspace
      - ./data:/opt/flink/data
    networks:
      - de_net

  taskmanager:
    build: .
    image: pyflink
    container_name: flink_taskmanager
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: jobmanager
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
    volumes:
      - ./workspace:/opt/flink/workspace
      - ./data:/opt/flink/data
    networks:
      - de_net

networks:
  de_net:
    external: true